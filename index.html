<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <title>KMB & CTB ETA 實時到站與轉車導航</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    :root {
      --primary: #1565c0;
      --primary-light: #e3f2fd;
      --primary-dark: #0d47a1;
      --secondary: #d32f2f;
      --secondary-light: #ffebee;
      --walk-green: #2e7d32;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.06);
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 0 10px 32px;
      background-color: var(--bg);
      color: var(--text-main);
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
    }

    /* 頂部標題欄 */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      margin: 8px 0;
      background: linear-gradient(135deg, #0d47a1, #1976d2);
      color: #fff;
      border-radius: var(--radius);
      box-shadow: 0 4px 12px rgba(25, 118, 210, 0.25);
    }
    .app-header h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .app-header .badge-live {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.2);
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 500;
    }

    h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section {
      margin-top: 10px;
      background: var(--card-bg);
      padding: 12px 14px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }

    /* 地圖容器 */
    #map {
      margin-top: 8px;
      height: 40vh;
      min-height: 250px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      z-index: 1;
    }

    /* Step 1 & Step 4 雙欄佈局 */
    #step1-layout,
    #transfer-step1-layout {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    #route-search-area,
    #transfer-route-search-area {
      flex: 1;
      min-width: 0;
    }
    #vk-container,
    #transferVkContainer {
      width: 44vw;
      max-width: 220px;
      border-left: 1px solid var(--border);
      padding-left: 8px;
      flex-shrink: 0;
    }

    /* 路線列表 */
    #routeList,
    #transferRouteList {
      max-height: 250px;
      overflow-y: auto;
      margin-top: 6px;
      border-radius: 8px;
    }

    .route-item {
      padding: 9px 10px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      transition: background 0.15s ease, transform 0.1s ease;
      border-radius: 6px;
    }
    .route-item:hover {
      background: var(--primary-light);
    }
    .route-item:active {
      background: #bbdefb;
    }

    /* 通用按鈕 */
    button {
      padding: 8px 14px;
      margin: 4px 6px 4px 0;
      font-size: 14px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    button:hover:not(:disabled) {
      border-color: var(--primary);
      color: var(--primary);
      background: #f8fafc;
    }
    button:active:not(:disabled) {
      transform: translateY(1px);
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
      box-shadow: none;
    }

    #routeInputDisplay,
    #transferRouteInputDisplay {
      min-height: 24px;
      font-size: 17px;
      font-weight: 700;
      color: var(--primary);
      padding: 2px 4px;
    }

    /* 虛擬鍵盤 */
    .vk-row {
      display: flex;
      gap: 4px;
      margin-bottom: 5px;
      flex-wrap: wrap;
    }
    .vk-label {
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-muted);
    }

    .vk-key {
      flex: 1;
      min-width: 34px;
      text-align: center;
      padding: 8px 2px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      cursor: pointer;
      user-select: none;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      box-shadow: 0 2px 0 #cbd5e1;
      transition: all 0.1s ease;
    }
    .vk-key.disabled {
      opacity: 0.22;
      cursor: default;
      box-shadow: none;
      background: #f1f5f9;
    }
    .vk-key:hover:not(.disabled) {
      background: var(--primary-light);
      border-color: var(--primary);
    }
    .vk-key:active:not(.disabled) {
      transform: translateY(2px);
      box-shadow: 0 0 0 #cbd5e1;
    }
    .vk-key.special {
      min-width: 56px;
      background: #fffbeb;
      border-color: #fde68a;
      box-shadow: 0 2px 0 #fcd34d;
      font-size: 13px;
    }

    .direction-buttons {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .direction-buttons button {
      flex: 1;
      min-width: 140px;
      margin: 0;
    }

    #headwayInfo,
    #transferHeadwayInfo {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* 車站列表 */
    .stop-list {
      margin-top: 8px;
      border-top: 1px solid var(--border);
    }
    .stop-item {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s ease;
      border-radius: 6px;
      margin: 2px 0;
    }
    .stop-item:hover {
      background: #f8fafc;
    }
    .stop-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .stop-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      color: #0f172a;
    }
    .stop-item.selected {
      background: var(--primary-light);
      border-left: 4px solid var(--primary);
      padding-left: 8px;
    }
    #transferStopList .stop-item.selected {
      background: var(--secondary-light);
      border-left: 4px solid var(--secondary);
    }

    .eta-block {
      margin-top: 6px;
      padding: 4px 8px;
      background: rgba(255, 255, 255, 0.75);
      border-radius: 6px;
    }
    .eta-block:empty {
      display: none;
    }
    .eta-row {
      font-size: 13px;
      padding: 4px 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px dashed #e2e8f0;
    }
    .eta-row:last-child {
      border-bottom: none;
    }
    .eta-imminent {
      color: #d32f2f !important;
      font-weight: 700;
    }

    .summary-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .stop-eta-summary {
      font-size: 12px;
      font-weight: 500;
    }
    .stop-boarding-info {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-dark);
      background: #dbeafe;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .stop-boarding-info:empty {
      display: none;
    }

    .btn-small {
      padding: 3px 8px;
      font-size: 11px;
      margin-left: 4px;
      background: #eff6ff;
      color: var(--primary);
      border-color: #bfdbfe;
      border-radius: 999px;
    }
    .btn-small:hover {
      background: var(--primary);
      color: #fff !important;
    }

    #interchangeInfo {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-dark);
      background: #eff6ff;
      padding: 6px 10px;
      border-radius: 8px;
      border-left: 3px solid var(--primary);
    }
    #interchangeInfo:empty {
      display: none;
    }
    #interchangeControls {
      margin-top: 6px;
    }

    #transfer-search-section {
      margin-top: 12px;
      border-top: 3px solid var(--secondary);
    }
    #transfer-search-section h3 {
      color: var(--secondary);
    }

    .btn-show-all-stops {
      font-size: 12px;
      padding: 4px 10px;
      margin-left: 4px;
    }

    #btnResetTransfer {
      margin-top: 10px;
      font-size: 13px;
      padding: 6px 12px;
      display: none;
      background: #fff1f2;
      color: #be123c;
      border-color: #fecdd3;
    }

    /* ========= 上車站 / 轉車站 顏色樣式 ========= */
    .eta-row.tracked {
      font-weight: 700;
      color: #0b3d91 !important;
      background: #dbeafe;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .eta-row.transfer-tracked {
      font-weight: 700;
      color: #b91c1c !important;
      background: #fee2e2;
      padding: 4px 6px;
      border-radius: 4px;
    }

    /* 地圖控制與全螢幕按鈕 */
    .leaflet-control-fullscreen-btn {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      width: 34px;
      height: 34px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #1e293b;
    }
    .leaflet-control-fullscreen-btn:hover {
      background: #f1f5f9;
    }

    .btn-track {
      font-size: 11px;
      padding: 2px 8px;
      margin-left: 6px;
      line-height: 1.3;
      border-radius: 999px;
      border: 1px solid #94a3b8;
      background: #f8fafc;
      color: #334155;
    }
    .btn-track.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* 巴士站點數字標籤 - 藍色 (第一程) */
    .stop-label {
      background-color: #1565c0;
      color: white;
      border-radius: 50%;
      width: 24px !important;
      height: 24px !important;
      line-height: 20px;
      text-align: center;
      font-size: 11px;
      font-weight: 700;
      border: 2px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 巴士站點數字標籤 - 紅色 (第二程轉車) */
    .stop-label.second-route {
      background-color: #e53935;
    }

    /* 步行資訊提示框 */
    #transferWalkInfo {
      margin-top: 6px;
      padding: 6px 10px;
      background: #f0fdf4;
      border-left: 3px solid var(--walk-green);
      border-radius: 6px;
      font-size: 13px;
      color: #166534;
    }
    #transferWalkInfo:empty {
      display: none;
    }

    /* 電話版優化 Toast */
    #toast-msg {
      visibility: hidden;
      width: auto;
      max-width: 85%;
      min-width: 200px;
      background-color: rgba(15, 23, 42, 0.92);
      color: #fff;
      text-align: center;
      border-radius: 999px;
      padding: 10px 20px;
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 36px;
      transform: translateX(-50%);
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      white-space: nowrap;
      backdrop-filter: blur(4px);
    }

    #toast-msg.show {
      visibility: visible;
      animation: fadein 0.35s, fadeout 0.35s 2.65s;
    }

    @keyframes fadein { from {bottom: 10px; opacity: 0;} to {bottom: 36px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 36px; opacity: 1;} to {bottom: 10px; opacity: 0;} }
  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
</head>
<body>
  <div class="app-header">
    <h2>🚌 KMB / CTB 實時轉車導航</h2>
    <span class="badge-live">實時道路導航</span>
  </div>

  <div id="map"></div>

  <div class="section" id="step1-section">
    <h3>Step 1：輸入路線</h3>
    <div id="step1-layout">
      <div id="route-search-area">
        <div>路線：<span id="routeInputDisplay"></span></div>
        <div id="routeList">請先輸入至少一個字元。</div>
      </div>
      <div id="vk-container"></div>
    </div>
  </div>

  <div class="section" id="step2-section">
    <h3>Step 2：揀方向</h3>
    <div class="direction-buttons">
      <button id="dirInbound" disabled>往 ? 方向</button>
      <button id="dirOutbound" disabled>往 ? 方向</button>
    </div>
    <div id="headwayInfo"></div>
    <div id="interchangeInfo"></div>
    <div id="interchangeControls"></div>
  </div>

  <div class="section" id="step3-section">
    <h3>Step 3：巴士站</h3>
    <div id="stopList" class="stop-list"></div>
  </div>

  <div class="section" id="transfer-search-section" style="display:none;">
    <h3 id="step4-title">Step 4：於轉車站再揀下一程</h3>
    <div id="transfer-search-container">
      <div id="transfer-main-line">
        <strong>轉車路線：</strong><span id="transferRouteInputDisplay"></span>
      </div>
      <div id="transfer-step1-layout">
        <div id="transfer-route-search-area">
          <div id="transferRouteList">請輸入路線，會以同名站作為預設轉車站。</div>
        </div>
        <div id="transferVkContainer"></div>
      </div>

      <div id="transfer-direction-block" style="margin-top:8px;">
        <strong>轉車方向：</strong>
        <div class="direction-buttons">
          <button id="transferDirInbound" disabled>往 ? 方向</button>
          <button id="transferDirOutbound" disabled>往 ? 方向</button>
        </div>
        <div id="transferHeadwayInfo"></div>
      </div>

      <div id="transfer-stop-block" style="margin-top:8px;">
        <strong>轉車後巴士站：</strong>
        <div id="transferWalkInfo"></div>
        <div id="transferStopList" class="stop-list"></div>
      </div>

      <button id="btnResetTransfer">重新選擇轉車（Step 4）</button>
    </div>
  </div>
  <div id="toast-msg"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="script_bus.js"></script>
</body>
</html>
