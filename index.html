<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <title>KMB & CTB 實時轉車與防曬坐位導航</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    :root {
      --primary: #1565c0;
      --primary-light: #e3f2fd;
      --primary-dark: #0d47a1;
      --secondary: #e53935;
      --secondary-light: #ffebee;
      --walk-green: #2e7d32;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang HK", "Microsoft JhengHei", sans-serif;
      color: var(--text-main); background: #e2e8f0;
    }

    /* 1. 全螢幕地圖 */
    #map { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 1; }
    .leaflet-bottom { bottom: 92px !important; transition: bottom 0.25s ease; }

    /* 用家 GPS 綠點 */
    .user-gps-dot {
      width: 16px; height: 16px; background: #00c853; border: 3px solid #fff; border-radius: 50%;
      box-shadow: 0 0 0 6px rgba(0, 200, 83, 0.28), 0 2px 6px rgba(0,0,0,0.4);
    }

    /* 2. 底部上拉抽屜 (第一下拉上去更高：86vh + translateY(16%)) */
    #bottom-sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: 86vh; max-height: 90vh;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(12px);
      border-radius: 20px 20px 0 0;
      box-shadow: 0 -6px 30px rgba(15, 23, 42, 0.18);
      z-index: 1000; display: flex; flex-direction: column;
      transform: translateY(calc(100% - 76px));
      transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                  width 0.32s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform, width;
      border: 1px solid rgba(226, 232, 240, 0.9);
    }
    #bottom-sheet.sheet-collapsed { transform: translateY(calc(100% - 76px)); }
    /* ★ 第一下拉上去拉高啲 (只留 16% 距離底部) */
    /* 平板維持高身；電話版第一下拉上去留返約 28% 位置俾地圖 */
    #bottom-sheet.sheet-half { transform: translateY(16%); }
    @media (max-width: 767px) {
      #bottom-sheet.sheet-half { transform: translateY(28%); }
    }

    /* 新增：下拉一下岩岩好顯示揀緊嗰個站嘅 ETA (由 JS 動態計精準高度) */
    #bottom-sheet.sheet-peek {
      transform: translateY(var(--peek-offset, calc(100% - 210px)));
    }

    /* 確保任何一個站（包括尾站）都可以 Scroll 到貼住抽屜頂部 */
    #primary-panel, #transfer-search-section {
      padding-bottom: 65vh !important;
    }

    #bottom-sheet.sheet-full { transform: translateY(0%); }
    #bottom-sheet.dragging { transition: none !important; }

    /* ★ 平板模式 (>= 768px)：平時 450px 泊右下角，轉車 Step 4 變 900px 雙欄並排 */
    @media (min-width: 768px) {
      #bottom-sheet {
        left: auto;
        right: 16px;
        width: 450px;
        max-width: calc(100vw - 32px);
      }
      #bottom-sheet.has-transfer {
        width: 900px;
      }
      #sheet-body {
        flex-direction: row !important;
      }
      #primary-panel {
        border-right: 1px solid var(--border);
      }
      #transfer-search-section {
        border-top: none !important;
      }
      #mobile-leg-tabs {
        display: none !important;
      }
    }

    /* 電話模式 (< 768px) */
    @media (max-width: 767px) {
      #bottom-sheet.has-transfer #mobile-leg-tabs { display: flex; }
      #bottom-sheet.has-transfer.mobile-show-leg2 #primary-panel { display: none !important; }
      #bottom-sheet.has-transfer.mobile-show-leg1 #transfer-search-section { display: none !important; }
    }

    /* 抽屜頂部拉柄 */
    #sheet-header {
      padding: 8px 16px 10px; cursor: grab; user-select: none; touch-action: none;
      border-bottom: 1px solid var(--border); flex-shrink: 0; background: #fff;
      border-radius: 20px 20px 0 0;
    }
    .sheet-pill { width: 44px; height: 5px; background: #cbd5e1; border-radius: 999px; margin: 0 auto 8px; }
    .sheet-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .sheet-brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; color: var(--primary-dark); min-width: 0; }
    .sheet-brand span.status-hint {
      font-size: 12px; font-weight: 600; color: var(--text-muted); background: #f1f5f9;
      padding: 3px 10px; border-radius: 999px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .btn-sheet-toggle {
      padding: 4px 10px; font-size: 12px; font-weight: 700; border-radius: 999px;
      background: var(--primary-light); color: var(--primary); border: none; margin: 0;
    }

    /* 電話版 Tabs */
    #mobile-leg-tabs {
      display: none; padding: 6px 12px; background: #f1f5f9; gap: 6px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .leg-tab-btn {
      flex: 1; padding: 7px 10px; margin: 0; border-radius: 8px; font-size: 13px; font-weight: 700;
      border: 1px solid transparent; background: transparent; color: var(--text-muted);
    }
    .leg-tab-btn.active-leg1 { background: #fff; color: var(--primary); border-color: #bfdbfe; }
    .leg-tab-btn.active-leg2 { background: #fff; color: var(--secondary); border-color: #fecdd3; }

    /* 抽屜主體 */
    #sheet-body { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    #primary-panel, #transfer-search-section {
      flex: 1; min-height: 0; overflow-y: auto; padding: 10px 12px 28px; background: #fff;
    }
    #primary-panel { display: flex; flex-direction: column; }

    /* Step 1+2+3 無縫合一 */
    .unified-step-block { margin: 0; padding: 0; border: none; background: transparent; }
    .route-header-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
      padding: 6px 10px; margin-bottom: 8px;
    }
    .route-header-title { font-size: 13px; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    #routeInputDisplay { font-size: 16px; font-weight: 800; color: var(--primary); }
    #transferRouteInputDisplay { font-size: 16px; font-weight: 800; color: var(--secondary); }

    /* ★ 鍵盤方格拉高 20% (276px -> 332px) */
    #step1-layout, #transfer-step1-layout {
      display: flex; align-items: stretch; gap: 8px;
      height: 332px; min-height: 332px; max-height: 332px;
      margin-bottom: 8px; background: #f8fafc; border: 1px solid var(--border);
      border-radius: 12px; padding: 8px; overflow: hidden;
    }
    #step1-layout.compact-mode, #transfer-step1-layout.compact-mode {
      height: auto; min-height: 0; max-height: none; padding: 0; margin-bottom: 4px; border: none; background: transparent;
    }
    #route-search-area, #transfer-route-search-area {
      flex: 1; min-width: 0; display: flex; flex-direction: column; height: 100%; overflow: hidden;
    }
    #routeList, #transferRouteList {
      flex: 1; height: 100%; overflow-y: auto; background: #fff;
      border: 1px solid var(--border); border-radius: 8px; padding: 4px;
    }
    #step1-layout.compact-mode #route-search-area,
    #transfer-step1-layout.compact-mode #transfer-route-search-area { display: none; }

    #vk-container, #transferVkContainer {
      width: 200px; flex-shrink: 0; display: flex; flex-direction: column;
      justify-content: flex-start; height: 100%; overflow: hidden;
    }
    #step1-layout.compact-mode #vk-container,
    #transfer-step1-layout.compact-mode #transferVkContainer {
      width: auto; height: auto; flex-direction: row; justify-content: flex-end;
    }

    .vk-top-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 5px; flex-shrink: 0; }
    /* ★ 數字鍵隨方格加高 20% (34px -> 41px) */
    .vk-numpad-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 41px);
      gap: 5px; margin-bottom: 6px; flex-shrink: 0;
    }
    .vk-letters-wrap {
      flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-wrap: wrap;
      align-content: flex-start; gap: 4px; padding-top: 5px; border-top: 1px dashed #cbd5e1;
    }
    .vk-key {
      display: flex; align-items: center; justify-content: center; border-radius: 8px;
      border: 1px solid #cbd5e1; background: #fff; cursor: pointer; user-select: none;
      font-size: 16px; font-weight: 700; color: var(--text-main); box-shadow: 0 1px 0 #cbd5e1;
      margin: 0; padding: 0; height: 100%;
    }
    .vk-key.letter-key {
      width: calc(25% - 3px); height: 34px; font-size: 13.5px;
      background: #eff6ff; color: var(--primary-dark); border-color: #93c5fd;
    }
    .vk-key.disabled { opacity: 0.2; cursor: default; box-shadow: none; background: #e2e8f0; pointer-events: none; }
    .vk-key.special { height: 35px; padding: 0 10px; background: #fffbeb; border-color: #fde68a; font-size: 13px; }

    .route-item { padding: 7px 8px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 13px; font-weight: 500; border-radius: 6px; }
    .route-item:hover { background: var(--primary-light); }

    button {
      padding: 7px 12px; margin: 2px 4px 2px 0; font-size: 13px; font-weight: 600;
      border-radius: 8px; border: 1px solid #cbd5e1; background: #fff; color: var(--text-main); cursor: pointer;
    }
    button:disabled { opacity: 0.38; cursor: default; }
    .direction-buttons { display: flex; gap: 6px; margin-top: 4px; }
    .direction-buttons button { flex: 1; margin: 0; padding: 8px 10px; background: #f8fafc; }

    #headwayInfo, #transferHeadwayInfo {
      margin-top: 6px; font-size: 12px; color: var(--text-muted);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px;
    }

    /* ☀️ 日光防曬坐位建議 & 📍 步行去車站資訊橫額 */
    .info-pill-box {
      margin-top: 6px; padding: 6px 10px; border-radius: 8px;
      font-size: 12px; font-weight: 600;
    }
    .info-pill-box:empty { display: none; }
    .sun-advice-box { background: linear-gradient(90deg, #fffbeb, #fef3c7); color: #92400e; border-left: 3px solid #f59e0b; }
    .walk-user-box { background: #f3e8ff; color: #6b21a8; border-left: 3px solid #9333ea; }

    /* ★ 徹底隱藏「轉車模式：上車站...」嗰句 */
    #interchangeInfo { display: none !important; }
    #interchangeControls { margin-top: 4px; }

    .stop-list { margin-top: 6px; border-top: 1px solid var(--border); }
    .stop-item { padding: 8px 8px; border-bottom: 1px solid #f1f5f9; font-size: 13.5px; cursor: pointer; border-radius: 6px; }
    .stop-header { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .stop-title { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .stop-item.selected { background: var(--primary-light); border-left: 4px solid var(--primary); padding-left: 8px; }
    #transferStopList .stop-item.selected { background: var(--secondary-light); border-left: 4px solid var(--secondary); }

    .eta-block { margin-top: 6px; padding: 4px 8px; background: rgba(255,255,255,0.85); border-radius: 6px; }
    .eta-block:empty { display: none; }
    .eta-row { font-size: 12.5px; padding: 4px 2px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px dashed #e2e8f0; }
    .eta-row:last-child { border-bottom: none; }
    .eta-imminent { color: #d32f2f !important; font-weight: 700; }
    .eta-row.tracked { font-weight: 700; color: #0b3d91 !important; background: #dbeafe; padding: 4px 6px; border-radius: 4px; }
    .eta-row.transfer-tracked { font-weight: 700; color: #b91c1c !important; background: #fee2e2; padding: 4px 6px; border-radius: 4px; }

    .summary-wrapper { display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; }
    .stop-eta-summary { font-size: 11.5px; font-weight: 500; }
    .stop-boarding-info { font-size: 11px; font-weight: 700; color: var(--primary-dark); background: #dbeafe; padding: 2px 6px; border-radius: 4px; }
    .stop-boarding-info:empty { display: none; }
    .btn-small { padding: 2px 8px; font-size: 11px; margin-left: 4px; background: #eff6ff; color: var(--primary); border-color: #bfdbfe; border-radius: 999px; }
    .btn-track { font-size: 10.5px; padding: 2px 7px; margin-left: 6px; border-radius: 999px; border: 1px solid #94a3b8; background: #f8fafc; }
    .btn-track.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    #btnResetTransfer { margin-top: 8px; font-size: 12px; padding: 5px 10px; display: none; background: #fff1f2; color: #be123c; border-color: #fecdd3; }

    .stop-label {
      background-color: #1565c0; color: white; border-radius: 50%; width: 24px !important; height: 24px !important;
      line-height: 20px; text-align: center; font-size: 11px; font-weight: 700; border: 2px solid white;
      box-shadow: 0 2px 5px rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center;
    }
    .stop-label.second-route { background-color: #e53935; }
    .leaflet-control-fullscreen-btn {
      background: #fff; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px;
    }
    #transferWalkInfo { margin-top: 6px; padding: 6px 10px; background: #f0fdf4; border-left: 3px solid var(--walk-green); border-radius: 6px; font-size: 12px; color: #166534; }
    #transferWalkInfo:empty { display: none; }

    /* ★ 頂部長期追蹤常駐通知卡 (配合系統 Notification 雙重顯示，左邊車到倒數、右邊步程倒數) */
    #live-track-banner {
      display: none;
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      width: calc(100vw - 20px); max-width: 500px;
      background: rgba(15, 23, 42, 0.95); color: #fff;
      border-radius: 14px; padding: 10px 14px;
      z-index: 9500; box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.15);
      align-items: stretch; justify-content: space-between; gap: 10px;
    }
    #live-track-banner.active { display: flex; }
    .ltb-left { flex: 1.2; border-right: 1px solid rgba(255,255,255,0.2); padding-right: 10px; display: flex; flex-direction: column; justify-content: center; }
    .ltb-right { flex: 1; padding-left: 2px; display: flex; flex-direction: column; justify-content: center; }
    .ltb-route { font-size: 13px; font-weight: 800; color: #60a5fa; }
    .ltb-stop { font-size: 12px; color: #e2e8f0; margin-top: 2px; }
    .ltb-eta { font-size: 15px; font-weight: 800; color: #fde047; margin-top: 3px; }
    .ltb-walk-dist { font-size: 12px; color: #c084fc; font-weight: 700; }
    .ltb-walk-time { font-size: 14px; font-weight: 800; color: #4ade80; margin-top: 3px; }
    .ltb-close {
      background: transparent; border: none; color: #94a3b8; font-size: 16px;
      padding: 0 4px; margin: 0; cursor: pointer; align-self: flex-start;
    }

    #toast-msg {
      visibility: hidden; width: auto; max-width: 85%; min-width: 200px; background-color: rgba(15, 23, 42, 0.92);
      color: #fff; text-align: center; border-radius: 999px; padding: 10px 20px; position: fixed;
      z-index: 9999; left: 50%; top: 18px; transform: translateX(-50%); font-size: 13px; font-weight: 600;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35); white-space: nowrap;
    }
    #toast-msg.show { visibility: visible; animation: toastIn 0.3s, toastOut 0.3s 2.7s; }
    @keyframes toastIn { from {top: -10px; opacity: 0;} to {top: 18px; opacity: 1;} }
    @keyframes toastOut { from {top: 18px; opacity: 1;} to {top: -10px; opacity: 0;} }
	
	    /* ★ 平板模式加闊 80px (單程 530px / 轉車雙欄 1060px) */
    @media (min-width: 768px) {
      #bottom-sheet {
        width: 530px !important;
      }
      #bottom-sheet.has-transfer {
        width: 1060px !important;
        max-width: calc(100vw - 24px) !important;
      }
    }

    /* ★ 路線搜尋結果：左邊顏色 Tag + 第一行(路線+種類) + 第二行(總站) */
    .route-item {
      display: flex;
      align-items: stretch;
      padding: 0 !important;
      margin: 5px 2px;
      background: #ffffff;
      border: 1px solid #e2e8f0 !important;
      border-radius: 8px !important;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .route-item:hover {
      background: #f1f5f9 !important;
    }

    /* 最左邊顏色 Tag 條 */
    .route-color-bar {
      width: 7px;
      flex-shrink: 0;
    }
    .route-color-bar.co-kmb {
      background: #e53935; /* 九巴紅 */
    }
    .route-color-bar.co-ctb {
      background: #facc15; /* 城巴黃 */
    }
    .route-color-bar.co-joint {
      /* 九巴/城巴：上紅下黃各半 */
      background: linear-gradient(180deg, #e53935 50%, #facc15 50%);
    }
    .route-color-bar.co-gmb {
      background: #16a34a; /* 小巴綠 */
    }

    .route-item-content {
      flex: 1;
      min-width: 0;
      padding: 6px 9px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    /* 第一行：路線號碼 + 公司章 */
    .route-row-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .route-code-text {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: 0.2px;
    }
    .route-co-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 5px;
      line-height: 1.4;
    }
    .route-co-tag.co-kmb {
      background: #fee2e2;
      color: #b91c1c;
    }
    .route-co-tag.co-ctb {
      background: #fef08a;
      color: #854d0e;
    }
    .route-co-tag.co-joint {
      /* 紅黃各半漸層底章 */
      background: linear-gradient(90deg, #fecaca 50%, #fef08a 50%);
      color: #1e293b;
      border: 1px solid #cbd5e1;
    }
    .route-co-tag.co-gmb {
      background: #dcfce7;
      color: #166534;
    }

    /* 第二行：總站名稱 */
    .route-row-bottom {
      font-size: 12px;
      font-weight: 500;
      color: #475569;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

  </style>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
  <div id="map"></div>

  <!-- 常駐追蹤通知橫額（左邊車到倒數｜右邊步程倒數） -->
  <div id="live-track-banner">
    <div class="ltb-left">
      <div class="ltb-route" id="ltbRoute">--</div>
      <div class="ltb-stop" id="ltbStop">--</div>
      <div class="ltb-eta" id="ltbEta">--</div>
    </div>
    <div class="ltb-right">
      <div class="ltb-walk-dist" id="ltbWalkDist">--</div>
      <div class="ltb-walk-time" id="ltbWalkTime">--</div>
    </div>
    <button class="ltb-close" id="ltbCloseBtn" title="停止追蹤通知">✕</button>
  </div>

  <div id="bottom-sheet" class="sheet-half">
    <div id="sheet-header">
      <div class="sheet-pill"></div>
      <div class="sheet-title-row">
        <div class="sheet-brand">
          <span>🚌 路線與實時導航</span>
          <span class="status-hint" id="sheetStatusHint">向上拉輸入路線</span>
        </div>
        <div class="sheet-quick-btns">
          <button type="button" class="btn-sheet-toggle" id="btnSheetToggle">全開 ▲</button>
        </div>
      </div>
    </div>

    <div id="mobile-leg-tabs">
      <button type="button" class="leg-tab-btn active-leg1" id="tabLeg1">🚌 第一程 (上車/轉車)</button>
      <button type="button" class="leg-tab-btn" id="tabLeg2">🔄 第二程 (轉車接駁)</button>
    </div>

    <div id="sheet-body">
      <div id="primary-panel">
        <div class="unified-step-block" id="step1-section">
          <div class="route-header-bar">
            <div class="route-header-title">
              <span>第一程路線：</span>
              <span id="routeInputDisplay">(未輸入)</span>
            </div>
          </div>
          <div id="step1-layout">
            <div id="route-search-area">
              <div id="routeList">請先輸入至少一個字元。</div>
            </div>
            <div id="vk-container"></div>
          </div>
        </div>

        <div class="unified-step-block" id="step2-section">
          <div class="direction-buttons">
            <button id="dirInbound" disabled>往 ? 方向</button>
            <button id="dirOutbound" disabled>往 ? 方向</button>
          </div>
          <div id="headwayInfo"></div>
          <div id="userWalkInfo" class="info-pill-box walk-user-box"></div>
          <div id="sunAdviceInfo" class="info-pill-box sun-advice-box"></div>
          <div id="interchangeInfo"></div>
          <div id="interchangeControls"></div>
        </div>

        <div class="unified-step-block" id="step3-section">
          <div id="stopList" class="stop-list"></div>
        </div>
      </div>

      <div class="unified-step-block" id="transfer-search-section" style="display:none;">
        <div id="transfer-search-container">
          <div class="route-header-bar">
            <div class="route-header-title" id="transfer-main-line">
              <span id="step4-title" style="color:#e53935;font-weight:800;">轉車路線：</span>
              <span id="transferRouteInputDisplay">(未輸入)</span>
            </div>
          </div>
          <div id="transfer-step1-layout">
            <div id="transfer-route-search-area">
              <div id="transferRouteList">請輸入路線，會以同名站作為預設轉車站。</div>
            </div>
            <div id="transferVkContainer"></div>
          </div>
          <div id="transfer-direction-block" style="margin-top:6px;">
            <strong style="font-size:12px;color:#64748b;">轉車方向：</strong>
            <div class="direction-buttons">
              <button id="transferDirInbound" disabled>往 ? 方向</button>
              <button id="transferDirOutbound" disabled>往 ? 方向</button>
            </div>
            <div id="transferHeadwayInfo"></div>
            <div id="transferSunAdviceInfo" class="info-pill-box sun-advice-box"></div>
          </div>
          <div id="transfer-stop-block" style="margin-top:6px;">
            <div id="transferWalkInfo"></div>
            <div id="transferStopList" class="stop-list"></div>
          </div>
          <button id="btnResetTransfer">重新選擇轉車（Step 4）</button>
        </div>
      </div>
    </div>
  </div>
